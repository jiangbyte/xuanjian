<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=20260821" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>玄鉴 / Xuanjian</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("xuanjian.theme") || "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f8fa;
        color: #1f2328;
      }
      html.dark,
      html.dark body {
        background: #0d1117;
        color: #e6edf3;
      }
      #root {
        height: 100%;
        min-height: 100vh;
      }
      #boot-splash {
        display: flex;
        height: 100%;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        color: #656d76;
        user-select: none;
      }
      html.dark #boot-splash {
        color: #8b949e;
      }
      #boot-splash::before {
        content: "";
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid #d0d7de;
        border-top-color: #0969da;
        animation: boot-spin 0.7s linear infinite;
      }
      html.dark #boot-splash::before {
        border-color: #30363d;
        border-top-color: #2f81f7;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="boot-splash" aria-live="polite" aria-busy="true">玄鉴</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
