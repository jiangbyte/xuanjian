[package]
name = "xuanjian"
version = "1.3.5"
description = "玄鉴 / Xuanjian - Agent O&M tool"
authors = ["Charlie"]
license = "MIT"
edition = "2021"

[lib]
name = "xuanjian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2.0"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.13"
if-addrs = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "stream"] }
bytes = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tower = "0.5"
http-body-util = "0.1"
which = "7"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-clipboard-manager = "2.3.2"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
sysinfo = "0.33"
netstat2 = "0.11"

[target.'cfg(windows)'.dependencies]
tauri-plugin-prevent-default = { version = "5.0.2", features = ["platform-windows"] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-prevent-default = "5.0.2"
