# Release：标题仅用 tag（如 v0.1.1），正文见 RELEASE_NOTES.md
#
# Author: Charlie
#
# 触发：推送 v* tag，或手动 workflow_dispatch（指定 tag）

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 git tag（如 v0.1.1）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macOS x64
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ matrix.platform }}-${{ matrix.rust_targets || 'host' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS runner 上 Vite/tsc 偶发 OOM
          NODE_OPTIONS: --max-old-space-size=8192
        with:
          # 标题与 tag 一致：v0.1.1（不带品牌名前缀）
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            ## Highlights

            - 定位为 **AI 桌面运维工作台**：主机、终端、脚本、网络、Docker 与内置 Agent 一体
            - **玄鉴 Agent**：本地 ReAct 编排 + SubAgent（巡检 / 终端执行 / 分析）
              - 可读脚本库与历史命令，并在可见终端执行（`run_script` / `terminal_run`）
              - 权限模式：计划 / 确认执行 / 完全执行；待确认操作固定展示在输入区上方
            - **模型与协议**
              - 自定义供应商与模型（上下文窗口、最大输出 Token、思考强度）
              - OpenAI 兼容 → `{base}/v1/chat/completions`；Anthropic Messages → `{base}/v1/messages`
              - 按文档填写 Base URL，不做供应商路径特例改写
            - **体验**：独立设置页；Agent 会话可恢复；计划 Markdown 正确渲染

            ## 安装包

            | 平台 | 产物 |
            | --- | --- |
            | Windows x64 | `*_x64-setup.exe`（NSIS，推荐）、`*_x64_en-US.msi` |
            | macOS Apple Silicon | `aarch64` 的 `.dmg` / `.app` 包 |
            | macOS Intel | `x64` 的 `.dmg` / `.app` 包 |
            | Linux x64 | `.deb`、`.AppImage`、`.rpm` |

            安装包不含本机用户数据；首次运行会在本机创建空库。

            Windows 需已安装 [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/)（系统通常已自带）。

            ## 反馈

            问题与建议：[Issues](https://github.com/jiangbyte/xuanjian/issues)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
