# Release：标题仅用 tag（如 v0.1.1），正文见 RELEASE_NOTES.md
#
# Author: Charlie
#
# 触发：推送 v* tag，或手动 workflow_dispatch（指定 tag）

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 git tag（如 v0.1.1）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macOS x64
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ matrix.platform }}-${{ matrix.rust_targets || 'host' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS runner 上 Vite/tsc 偶发 OOM
          NODE_OPTIONS: --max-old-space-size=8192
        with:
          # 标题与 tag 一致：v0.1.1（不带品牌名前缀）
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            ## Highlights

            ### Agent bottom terminal
            - Split workspace: user terminal on top, **Agent bottom panel** below (separate PTY, multi-tab)
            - `terminal_run` / `session_exec` execute visibly in the bottom panel
            - Transcript recording, replay, and `terminal_tail` aligned with the agent session

            ### Terminal & sidebar
            - Denser sidebar lists; Docker logs: selectable copy + auto-follow latest
            - SFTP toolbar horizontal scroll on narrow panes; collapse no longer remounts main xterm

            ### Agent & UI
            - LangGraph runtime (`agent-core` / `agent-adapters`) hardening
            - AI sidebar ReAct cards wrap instead of horizontal overflow
            - Settings: agent catalog, plugins/tools, MCP sections reorganized

            ### Network
            - Connections, traffic monitor, speed-test charts

            Full notes: [docs/release-notes/v1.3.0.md](https://github.com/jiangbyte/xuanjian/blob/main/docs/release-notes/v1.3.0.md)

            ## Installers

            | Platform | Artifacts |
            | --- | --- |
            | Windows x64 | `*_x64-setup.exe` (NSIS), `*_x64_en-US.msi` |
            | macOS Apple Silicon | `aarch64` `.dmg` / `.app` |
            | macOS Intel | `x64` `.dmg` / `.app` |
            | Linux x64 | `.deb`, `.AppImage`, `.rpm` |

            Installers do not include user data. Windows requires [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/).

            ## Feedback

            [Issues](https://github.com/jiangbyte/xuanjian/issues)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
